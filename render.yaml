services:
  - type: web
    name: waste-sorter-backend
    env: python
    buildCommand: pip install -r requirements.txt && python load_model.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /
    disk:
      name: model-storage
      mountPath: /opt/render/project/src
      sizeGB: 1

